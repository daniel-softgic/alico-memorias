<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe del evento · Memorias Alico × Softgic</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/al.css">
<style>
:root{--gold:#DA9100;--gold2:#F2B33D;--goldL:#FFF4DE;--ink:#1F1B16;--mut:#6E6558;--bg:#FBF8F3;--line:#ECE3D4;--r:22px}
html{font-size:clamp(13px,.95vw,19px)}
body{font-family:'Plus Jakarta Sans',Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1500px;margin:0 auto;padding:1.4rem 2rem 3rem}
.top{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.brands{display:flex;align-items:center;gap:.7rem;padding:.5rem .85rem;background:#fff;border:1px solid var(--line);border-radius:16px}.brands img{height:1.6rem;display:block}.brands .x{color:#b9ad9a}
.ttl small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.ttl h1{margin:.1rem 0 0;font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
.acts{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap}
.b{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.6rem 1rem;font-weight:700;font-size:.88rem;display:inline-flex;gap:.4rem;align-items:center;text-decoration:none;color:var(--ink)}
.b:hover{border-color:var(--gold)}.b.k{background:var(--ink);color:#fff;border-color:var(--ink)}.b.g{background:linear-gradient(135deg,var(--gold),var(--gold2));border:0}.b.d{color:#b3261e}
.tabs{display:flex;gap:.3rem;margin:1.2rem 0 1rem;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{background:none;padding:.8rem 1.1rem;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.pane{display:none}.pane.on{display:block}
.banner{background:var(--goldL);border:1px solid #F3D9A6;border-radius:14px;padding:.7rem 1rem;font-size:.9rem;margin-bottom:1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem}
.kp{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}.kp b{display:block;font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.kp small{color:var(--mut);font-weight:600;font-size:.8rem}.kp.g b{color:var(--gold)}
.grid{display:grid;gap:1rem;margin-top:1rem}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.25rem;break-inside:avoid}
.card h3{margin:0 0 .7rem;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 2.4rem;gap:.15rem .6rem;margin:.5rem 0;font-size:.88rem;font-weight:600}.bar .t{grid-column:1/-1;height:.5rem;background:#F3ECE0;border-radius:99px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:99px;background:var(--gold)}.bar b{text-align:right}
.quote{border-left:4px solid var(--gold);padding:.3rem .9rem;margin:.6rem 0;font-size:.92rem}.quote small{display:block;color:var(--mut);font-size:.78rem;margin-top:.15rem}
.ejec{font-size:1rem;line-height:1.6}.ejec h4{margin:1rem 0 .3rem;font-size:1rem}.ejec ul{margin:.3rem 0;padding-left:1.2rem}
/* casos */
.caso{display:grid;grid-template-columns:4.2rem 1fr;gap:1.1rem;background:#fff;border:1px solid var(--line);border-radius:26px;padding:1.3rem 1.4rem;margin-bottom:1rem;break-inside:avoid;position:relative;overflow:hidden}
.caso:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc)}
.rk{width:4.2rem;height:4.2rem;border-radius:20px;display:grid;place-items:center;font-size:2rem;background:var(--goldL)}
.caso h2{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:.2rem .65rem;background:#F3ECE0;color:var(--mut)}.tag.o1{background:var(--ink);color:#fff}.tag.o2{background:var(--gold);color:#fff}.tag.o3{background:#E8DFD0}
.val{color:var(--mut);margin:.35rem 0 .9rem}
.met{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}.met div{background:#FFFCF6;border:1px solid var(--line);border-radius:14px;padding:.55rem .75rem}.met b{display:block;font-size:1.35rem;font-weight:800}.met small{font-size:.72rem;color:var(--mut);font-weight:600}
.cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:1.2rem;margin-top:.9rem;font-size:.88rem}.cols h5{margin:0 0 .35rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.cols ul{margin:0;padding-left:1.1rem}.cols p{margin:0}
.score{position:absolute;right:1.3rem;top:1.2rem;text-align:right}.score b{font-size:2rem;font-weight:800;color:var(--cc)}.score small{display:block;font-size:.7rem;color:var(--mut);font-weight:700}
/* hoja de ruta */
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;position:relative}
.ola{background:#fff;border:1px solid var(--line);border-radius:24px;padding:1.1rem 1.2rem;break-inside:avoid}.ola .h{display:flex;justify-content:space-between;align-items:baseline}.ola .h b{font-size:1.15rem}.ola .h small{color:var(--gold);font-weight:800}
.ola .it{display:flex;gap:.6rem;align-items:flex-start;margin:.7rem 0;padding:.7rem;border-radius:14px;background:#FFFCF6;border:1px solid var(--line);font-size:.86rem}.ola .it span{font-size:1.5rem}
.tl{height:.6rem;border-radius:99px;background:linear-gradient(90deg,var(--ink) 0 25%,var(--gold) 25% 50%,#E8DFD0 50%);margin:1rem 0 .4rem}
.tll{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut);font-weight:700}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.6rem;margin:.6rem 0;font-size:.92rem}.steps li:before{content:counter(s);width:2rem;height:2rem;border-radius:50%;background:var(--goldL);color:var(--gold);font-weight:800;display:grid;place-items:center}
/* tabla */
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}.tools input,.tools select{border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:.86rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:#FFFCF6;padding:.7rem}td{padding:.65rem .7rem;border-top:1px solid var(--line);vertical-align:top}tr.rw{cursor:pointer}tr.rw:hover td{background:#FFFAF0}
td img{width:3.4rem;height:2.6rem;object-fit:cover;border-radius:8px}
.ex{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.ex .card p{color:var(--mut);font-size:.88rem;margin:.2rem 0 .8rem}
.pin{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center}.pin .card{width:min(24rem,90vw);text-align:center;padding:2rem}.pin input{width:100%;font-size:1.6rem;text-align:center;letter-spacing:.4em;border:1.5px solid var(--line);border-radius:14px;padding:.7rem;margin:1rem 0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}.sum div{background:#FFFCF6;border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;font-size:.86rem}.sum b{display:block;font-size:.7rem;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.ponly{display:none}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3,.road,.ex,.cols{grid-template-columns:1fr}.met{grid-template-columns:repeat(3,1fr)}}
@media print{
  @page{size:A4;margin:12mm}html{font-size:10.5px}body{background:#fff}.wrap{padding:0}
  .acts,.tabs,.tools,.banner .b,#p-datos,#p-resp,.noprint{display:none!important}.pane{display:block!important}.ponly{display:block}
  .pane+.pane{break-before:page}.card,.caso,.ola,.kp{box-shadow:none}
}
</style>
</head>
<body>
<div class="pin" id="pin"><div class="card"><img src="assets/alico.png" alt="Alico" style="height:2rem"><h2 style="margin:1rem 0 .2rem">Informe del evento</h2><p class="muted">Escribe el PIN del taller</p><input id="pv" type="password" inputmode="numeric" autofocus><button class="b k" id="pg" style="width:100%;justify-content:center">Entrar</button><p class="small muted" style="margin-top:.8rem"><a href="index.html" style="color:inherit">← Volver al muro</a></p></div></div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brands"><img src="assets/alico.png" alt="Alico"><span class="x">×</span><img src="assets/softgic.png" alt="Softgic"></div>
    <div class="ttl"><small id="evt"></small><h1>Informe del evento · Voz de los colaboradores</h1></div>
    <div class="acts"><a class="b" href="index.html">← Muro</a><button class="b" id="sync">☁️ Traer de la nube</button><button class="b" id="aj">⚙️ Ajustes</button><button class="b k" id="pr">🖨️ Imprimir / PDF</button></div>
  </header>
  <div class="ponly" style="margin:.4rem 0 1rem;color:#6E6558" id="pdate"></div>
  <nav class="tabs" id="tabs"><button data-p="res" class="on">Resumen</button><button data-p="casos">Informe por caso y hoja de ruta</button><button data-p="resp">Respuestas</button><button data-p="datos">Guardar y exportar</button></nav>
  <div id="ban"></div>
  <section class="pane on" id="p-res"></section>
  <section class="pane" id="p-casos"></section>
  <section class="pane" id="p-resp"></section>
  <section class="pane" id="p-datos"></section>
</div>

<script src="shared/al.js"></script>
<script src="shared/mem.js"></script>
<script>
(() => {
'use strict';
const esc = AL.esc, H = id => document.getElementById(id), $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('es-CO');
const SEM = 46; // semanas laborales al año

/* ---------- acceso ---------- */
const entrar = () => { if (H('pv').value !== AL.cfg.pin) { AL.toast('PIN incorrecto'); H('pv').value = ''; return; } sessionStorage.setItem('mem_adm', '1'); H('pin').remove(); H('app').hidden = false; render(); MEM.pull().then(ch => ch && render()); };
H('pg').onclick = entrar; H('pv').onkeydown = e => e.key === 'Enter' && entrar();
if (sessionStorage.getItem('mem_adm')) { H('pv').value = AL.cfg.pin; entrar(); }

H('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.p)); };
H('aj').onclick = AL.settings;
H('pr').onclick = () => print();
H('sync').onclick = async () => { if (!AL.hasCloud()) return AL.toast('Falta la clave de la nube en ⚙️ Ajustes'); AL.toast('Consultando la nube…'); await AL.sync(); const ch = await MEM.pull(); render(); AL.toast(ch ? 'Respuestas actualizadas desde la nube' : 'Ya tienes todo lo de la nube'); };

/* ---------- datos ---------- */
let conEj = false;
const data = () => { const r = MEM.reales(); return r.length && !conEj ? r : MEM.list(); };
const esEj = () => !MEM.reales().length || conEj;
const bars = (rows, max, col) => rows.filter(r => r[2]).map(([, n, k]) => `<div class="bar"><span>${esc(n)}</span><b>${k}</b><span class="t"><i style="width:${k / max * 100}%;${col ? 'background:' + col : ''}"></i></span></div>`).join('') || '<p class="muted small">Sin datos todavía.</p>';
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

function render() {
  const l = data(), s = MEM.stats(l);
  H('evt').textContent = MEM.cfg.evento + ' · GEN IA';
  H('pdate').textContent = 'Generado el ' + MEM.fmtFecha(Date.now()) + ' · ' + s.n + ' respuestas · Softgic para Alico';
  H('ban').innerHTML = esEj() ? `<div class="banner">⚠️ <span>${MEM.reales().length ? 'Estás viendo también las respuestas de <b>EJEMPLO</b>.' : 'Todavía no hay respuestas reales: lo que ves son <b>datos de EJEMPLO</b> para mostrar cómo quedará el informe.'}</span>${MEM.reales().length ? '<button class="b" id="sinEj">Ver solo las reales</button>' : ''}</div>` : `<div class="banner noprint" style="background:#fff">✅ <span><b>${s.n}</b> respuestas reales${MEM.cfg.desde ? ' (el contador del muro fue reiniciado, pero aquí está todo)' : ''}.</span><button class="b" id="conEj">Incluir ejemplos</button></div>`;
  if (H('sinEj')) H('sinEj').onclick = () => { conEj = false; render(); }; if (H('conEj')) H('conEj').onclick = () => { conEj = true; render(); };
  resumen(l, s); casos(l, s); respuestas(); datos();
}

/* ---------- 1 · resumen ---------- */
function resumen(l, s) {
  const md = Math.max(1, ...s.dolores.map(d => d[2])), ma = Math.max(1, ...s.ayudas.map(d => d[2])), mb = Math.max(1, ...s.barreras.map(d => d[2])), mar = Math.max(1, ...s.areas.map(d => d[2]));
  const mc = Math.max(1, ...s.casos.map(c => c.votos));
  const frases = l.filter(r => (r.t || [])[0]).slice(0, 6);
  const ej = AL.LS.get('mem_ejec', null), ejOk = ej && ej.n === s.n && !!ej.ej === esEj();
  H('p-res').innerHTML = `
  <div class="kpis"><div class="kp"><b>${s.n}</b><small>respuestas</small></div><div class="kp"><b>${s.personas}</b><small>colaboradores</small></div><div class="kp"><b>${s.grupos}</b><small>grupos</small></div><div class="kp"><b>${s.areas.length}</b><small>áreas representadas</small></div>
  <div class="kp g"><b>${fmt(s.horas)}</b><small>h/semana que el equipo dice perder</small></div><div class="kp g"><b>${fmt(s.horas * SEM)}</b><small>h/año (≈ ${fmt(s.horas * SEM / 1920)} personas de tiempo completo)</small></div></div>
  <div class="grid g2">
    <div class="card"><h3>Informe ejecutivo</h3><div class="ejec" id="ejec">${ejOk ? ej.html : ejecBasico(s)}</div><div class="noprint" style="margin-top:.8rem;display:flex;gap:.5rem"><button class="b g" id="gen">✨ ${ejOk ? 'Regenerar' : 'Redactar'} con IA</button><span class="small muted" style="align-self:center">${AL.hasIA() ? 'Usa la IA configurada en Ajustes' : 'Sin clave de IA: se muestra la versión automática'}</span></div></div>
    <div class="card"><h3>El caso que cada persona quiere primero</h3>${s.casos.slice().sort((a, b) => b.votos - a.votos).map(c => `<div class="bar"><span>${c.ic} ${esc(c.n)}</span><b>${c.votos}</b><span class="t"><i style="width:${c.votos / mc * 100}%;background:${c.c}"></i></span></div>`).join('')}
      <h3 style="margin-top:1.2rem">Qué tan listos se sienten (1 a 5)</h3><div style="display:flex;gap:.5rem;align-items:flex-end;height:5rem">${s.listoDist.map((k, i) => `<div style="flex:1;text-align:center;font-size:.8rem"><div style="height:${Math.max(4, k / Math.max(1, ...s.listoDist) * 3.6)}rem;background:${i >= 3 ? 'var(--gold)' : '#E8DFD0'};border-radius:8px 8px 0 0"></div>${MEM.LISTO[i]} ${k}</div>`).join('')}</div><p class="small muted" style="margin-top:.4rem">Promedio ${s.listo.toFixed(1)} de 5 · ${pct(s.listoDist[3] + s.listoDist[4], s.listoDist.reduce((a, b) => a + b, 0))}% se siente listo o muy listo.</p></div>
  </div>
  <div class="grid g3">
    <div class="card"><h3>Lo que más tiempo les quita</h3>${bars(s.dolores, md)}</div>
    <div class="card"><h3>Lo que quieren que la IA haga</h3>${bars(s.ayudas, ma, '#00758D')}</div>
    <div class="card"><h3>Lo que necesitan para adoptarla</h3>${bars(s.barreras, mb, '#53575A')}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Participación por área</h3>${bars(s.areas, mar, '#B15E14')}</div>
    <div class="card"><h3>En sus palabras</h3>${frases.map(r => `<div class="quote">“${esc(r.t[0])}”<small>${esc(r.participante || '')} · ${esc(r.rol || '')} · ${esc(r.area || '')}</small></div>`).join('') || '<p class="muted small">Sin respuestas todavía.</p>'}</div>
  </div>`;
  H('gen').onclick = () => ejecIA(s);
}
function ejecBasico(s) {
  const top = s.orden[0], d = s.dolores[0], a = s.ayudas[0], b = s.barreras[0];
  if (!s.n) return '<p class="muted">Aún no hay respuestas.</p>';
  return `<p><b>${s.personas} colaboradores</b> de ${s.areas.length} áreas contaron qué les quita tiempo y qué esperan de la IA. En conjunto reportan <b>${fmt(s.horas)} horas a la semana</b> de trabajo repetitivo que se podría liberar (≈ ${fmt(s.horas * SEM)} h al año).</p>
  <h4>Lo que dicen</h4><ul><li>La mayor fuente de tiempo perdido es <b>${esc(d[1].toLowerCase())}</b> (${d[2]} menciones).</li><li>Lo que más le piden a la IA: <b>${esc(a[1].toLowerCase())}</b>.</li><li>Para adoptarla necesitan sobre todo <b>${esc(b[1].toLowerCase())}</b>; la preparación promedio es ${s.listo.toFixed(1)} de 5.</li></ul>
  <h4>Por dónde empezar</h4><p><b>${top.ic} ${esc(top.n)}</b> encabeza la prioridad (puntaje ${top.score}/100) por interés, horas en juego y facilidad de implementación. Sigue <b>${esc(s.orden[1].n)}</b>. Ambos forman la primera ola de la hoja de ruta.</p>`;
}
async function ejecIA(s) {
  if (!AL.hasIA()) return AL.toast('Configura la clave de IA en ⚙️ Ajustes');
  H('ejec').innerHTML = '<p class="muted">Redactando el informe ejecutivo…</p>';
  const resumen = { respuestas: s.n, personas: s.personas, areas: s.areas.map(x => x[0] + ':' + x[2]), horas_semana: s.horas, preparacion: s.listo.toFixed(1), dolores: s.dolores.filter(x => x[2]).map(x => x[1] + ':' + x[2]), ayudas: s.ayudas.filter(x => x[2]).map(x => x[1] + ':' + x[2]), barreras: s.barreras.filter(x => x[2]).map(x => x[1] + ':' + x[2]),
    casos: s.orden.map(c => ({ caso: c.n, votos: c.votos, afines: c.afines, horas: c.horas, puntaje: c.score, ola: c.ola, frases: c.frases })) };
  const sys = 'Eres consultor senior de Softgic. Redacta en español de Colombia el informe ejecutivo de un taller de IA con colaboradores de Alico (empaques flexibles, Medellín) para la gerencia de Alico y de Softgic. Usa SOLO los datos dados; no inventes cifras. Formato HTML simple (<p>, <h4>, <ul><li>, <b>), máximo 230 palabras, con: 1) hallazgo principal, 2) 3 viñetas de lo que piden los colaboradores, 3) recomendación de por dónde empezar y por qué, 4) un riesgo de adopción y cómo mitigarlo.';
  try { const html = (await AL.claude(sys, JSON.stringify(resumen), { max: 900, tag: 'memorias-ejecutivo' })).replace(/```html?|```/g, '').replace(/<(?!\/?(p|h4|ul|li|b)\b)[^>]*>/g, ''); AL.LS.set('mem_ejec', { n: s.n, ej: esEj(), html }); H('ejec').innerHTML = html; }
  catch (e) { H('ejec').innerHTML = ejecBasico(s); AL.toast('No pude usar la IA: ' + e.message); }
}

/* ---------- 2 · informe por caso y hoja de ruta ---------- */
const OLAS = [['Ola 1', '0 a 3 meses', 'Pilotos rápidos con patrocinador y meta medible'], ['Ola 2', '3 a 6 meses', 'Escalar lo que funcionó y abrir el segundo frente'], ['Ola 3', '6 a 12 meses', 'Casos que requieren más integración y datos']];
const HABIL = { capacitacion: 'Ruta de formación práctica por rol (sesiones de 45 min en planta).', facil: 'Diseñar con los usuarios: pruebas en la línea antes de liberar.', datos: 'Diagnóstico de datos de Epicor y de las fuentes de cada caso.', jefe: 'Un patrocinador por caso con tiempo asignado al equipo.', confianza: 'Mensaje claro de la dirección: la IA apoya, no reemplaza; medir y mostrar el beneficio al equipo.', equipos: 'Revisión de conectividad y dispositivos en planta (tablets, wifi industrial).' };
function casos(l, s) {
  const reales = l, nombres = id => reales.filter(r => (r.a || {}).caso === id && r.padrino && r.padrino !== 'Por definir').map(r => r.padrino);
  H('p-casos').innerHTML = `
  <div class="card" style="margin-bottom:1rem"><h3>Cómo se priorizó</h3><p style="margin:0;font-size:.92rem">Puntaje de 0 a 100 = <b>50 %</b> interés de los colaboradores (votos directos + medio punto por quienes describieron un dolor o una necesidad que el caso resuelve) · <b>30 %</b> horas por semana en juego · <b>20 %</b> facilidad de implementación. Los dos primeros forman la Ola 1, los dos siguientes la Ola 2 y el último la Ola 3.</p></div>
  ${s.orden.map((c, i) => { const p = nombres(c.id), mb = c.barreras.slice(0, 3);
    return `<article class="caso" style="--cc:${c.c}"><div class="rk">${c.ic}</div><div><div class="score"><b>${c.score}</b><small>PUNTAJE</small></div>
      <h2>#${i + 1} · ${esc(c.n)} <span class="tag o${c.ola}">${OLAS[c.ola - 1][0]} · ${OLAS[c.ola - 1][1]}</span></h2><p class="val">${esc(c.valor)}</p>
      <div class="met"><div><b>${c.votos}</b><small>lo eligieron primero</small></div><div><b>${c.afines}</b><small>tienen un dolor que resuelve</small></div><div><b>${fmt(c.horas)}</b><small>h/semana en juego</small></div><div><b>${c.listo ? c.listo.toFixed(1) : '—'}</b><small>preparación (1–5)</small></div><div><b>${'●'.repeat(4 - c.cx)}${'○'.repeat(c.cx - 1)}</b><small>facilidad</small></div></div>
      <div class="cols"><div><h5>Cómo aporta valor · lo dicen ellos</h5>${c.frases.length ? c.frases.map(f => `<div class="quote" style="margin:.3rem 0">“${esc(f)}”</div>`).join('') : '<p class="muted">Nadie lo eligió primero; su interés viene de dolores relacionados.</p>'}<p style="margin-top:.4rem"><b>Áreas:</b> ${c.areas.map(a => esc(a[0]) + ' (' + a[1] + ')').join(', ') || '—'}</p></div>
      <div><h5>Piloto sugerido</h5><p>${esc(c.piloto)}</p><h5 style="margin-top:.7rem">Cómo medir</h5><ul>${c.kpis.map(k => `<li>${esc(k)}</li>`).join('')}</ul></div>
      <div><h5>Lo que se necesita de Alico</h5><p>${esc(c.necesita)}</p><h5 style="margin-top:.7rem">Lo que piden para adoptarlo</h5><p>${mb.map(b => esc(MEM.lab(MEM.BARRERAS, b[0])) + ' (' + b[1] + ')').join(', ') || '—'}</p><h5 style="margin-top:.7rem">Posibles padrinos</h5><p>${p.length ? esc([...new Set(p)].join(', ')) : 'Por definir'}</p></div></div></div></article>`; }).join('')}
  <div class="card" style="margin:1.4rem 0 1rem;break-before:page"><h3>Hoja de ruta para evaluar oportunidades</h3><div class="tl"></div><div class="tll"><span>Hoy</span><span>Mes 3</span><span>Mes 6</span><span>Mes 12</span></div></div>
  <div class="road">${OLAS.map((o, k) => `<div class="ola"><div class="h"><b>${o[0]}</b><small>${o[1]}</small></div><p class="small muted" style="margin:.2rem 0 0">${o[2]}</p>${s.orden.filter(c => c.ola === k + 1).map(c => `<div class="it"><span>${c.ic}</span><div><b>${esc(c.n)}</b><br>${esc(c.piloto)}</div></div>`).join('')}</div>`).join('')}</div>
  <div class="grid g2">
    <div class="card"><h3>Próximos pasos (30 días)</h3><ol class="steps">
      <li>Presentar este informe al comité de Alico y confirmar los casos de la Ola 1.</li>
      <li>Nombrar un patrocinador por caso${s.orden.slice(0, 2).some(c => nombres(c.id).length) ? ' (ya hay candidatos propuestos por los colaboradores)' : ''}.</li>
      <li>Sesión de descubrimiento de 2 horas por caso con Softgic: proceso actual, datos disponibles y meta.</li>
      <li>Definir la línea base de los indicadores (${esc(s.orden[0].kpis[0].toLowerCase())}, ${esc(s.orden[1].kpis[0].toLowerCase())}).</li>
      <li>Propuesta de piloto con alcance, cronograma y retorno esperado.</li></ol></div>
    <div class="card"><h3>Habilitadores transversales (lo que pidieron)</h3>${s.barreras.filter(b => b[2]).slice(0, 4).map(b => `<div class="it" style="display:flex;gap:.6rem;margin:.6rem 0;font-size:.9rem"><b style="min-width:2rem;color:var(--gold)">${pct(b[2], s.n)}%</b><div><b>${esc(b[1])}</b><br><span class="muted">${esc(HABIL[b[0]] || '')}</span></div></div>`).join('') || '<p class="muted small">Sin datos todavía.</p>'}</div>
  </div>`;
}

/* ---------- 3 · respuestas ---------- */
let fq = '', fc = '', fa = '';
function respuestas() {
  const l = data();
  if (!H('fq')) {
    H('p-resp').innerHTML = `<div class="tools"><input id="fq" placeholder="🔎 Buscar persona, idea o frase" style="flex:1;min-width:14rem"><select id="fc"><option value="">Todos los casos</option>${MEM.CASOS.map(c => `<option value="${c.id}">${c.ic} ${esc(c.n)}</option>`).join('')}</select><select id="fa"><option value="">Todas las áreas</option>${MEM.AREAS.map(a => `<option>${a}</option>`).join('')}</select></div><div id="tbl"></div>`;
    H('fq').oninput = e => { fq = AL.norm(e.target.value); respuestas(); }; H('fc').onchange = e => { fc = e.target.value; respuestas(); }; H('fa').onchange = e => { fa = e.target.value; respuestas(); };
  }
  const f = l.filter(r => (!fc || (r.a || {}).caso === fc) && (!fa || r.area === fa) && (!fq || AL.norm(JSON.stringify([r.participante, r.grupo, r.h, r.t])).includes(fq)));
  H('tbl').innerHTML = `<table><thead><tr><th></th><th>Fecha</th><th>Persona</th><th>Área</th><th>Tarea que le quita tiempo</th><th>Caso</th><th>h/sem equipo</th><th>Idea</th><th>Prep.</th></tr></thead><tbody>${f.map(r => { const a = r.a || {}, c = MEM.caso(a.caso) || {};
    return `<tr class="rw" data-id="${r.id}"><td>${r.foto ? `<img src="${r.foto}">` : ''}</td><td>${new Date(r.ts).toLocaleString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}${r.ejemplo ? '<br><span class="tag">ejemplo</span>' : ''}</td><td><b>${esc(r.participante || '')}</b><br><span class="muted small">${esc(r.rol || '')} · ${esc(r.grupo || '')}</span></td><td>${esc(r.area || '')}</td><td>${esc(MEM.lab(MEM.DOLORES, a.dolor) || '')}<br><span class="muted small">${esc(((r.t || [])[0] || '').slice(0, 110))}</span></td><td>${c.ic || ''} ${esc(c.n || '')}</td><td><b>${MEM.horasEquipo(r)}</b></td><td>${esc((r.h || {}).nombre_idea || '')}</td><td>${a.listo ? MEM.LISTO[a.listo - 1] + ' ' + a.listo : ''}</td></tr>`; }).join('') || '<tr><td colspan="9" class="muted">Sin resultados.</td></tr>'}</tbody></table>`;
  $$('#tbl tr.rw').forEach(tr => tr.onclick = () => detalle(tr.dataset.id));
}
function detalle(id) {
  const r = MEM.get(id); if (!r) return; const a = r.a || {}, h = r.h || {};
  const k = [MEM.lab(MEM.DOLORES, a.dolor), `${a.horas || '?'} h/sem × ${a.personas || '?'} personas = ${MEM.horasEquipo(r)} h`, (MEM.caso(a.caso) || {}).n, (a.ayuda || []).map(x => MEM.lab(MEM.AYUDAS, x)).join(', '), (a.barreras || []).map(x => MEM.lab(MEM.BARRERAS, x)).join(', ') + (a.listo ? ' · preparación ' + a.listo + '/5' : '')];
  AL.modal(`<div style="font-family:'Plus Jakarta Sans',sans-serif"><div style="display:grid;grid-template-columns:${r.foto ? '12rem ' : ''}1fr;gap:1rem">${r.foto ? `<img src="${r.foto}" style="width:100%;border-radius:16px">` : ''}<div><small style="color:#DA9100;font-weight:800">${esc(r.grupo || '')} · ${esc(r.area || '')}</small><h2 style="margin:.2rem 0">${esc(h.nombre_idea || '')}</h2><p class="muted">${esc(r.participante || '')} · ${esc(r.rol || '')} · ${new Date(r.ts).toLocaleString('es-CO')}</p><p>${esc(h.historia_usuario || '')}</p></div></div>
  <div class="sum">${MEM.Q.map((q, i) => `<div><b>${i + 1}. ${esc(q.corto)}</b>${esc(k[i] || '—')}${(r.t || [])[i] ? `<br><i>“${esc(r.t[i])}”</i>` : ''}</div>`).join('')}<div><b>Impacto · prioridad</b>${esc(h.impacto || '')} · ${esc(h.prioridad || '')}</div><div><b>Primer paso · padrino</b>${esc(h.primer_paso || '')} · ${esc(r.padrino || '')}</div></div>
  <div style="display:flex;justify-content:space-between;margin-top:1rem">${r.ejemplo ? '<span></span>' : '<button class="b d" id="del">🗑️ Eliminar esta respuesta</button>'}<button class="b k" onclick="AL.closeModal()">Cerrar</button></div></div>`);
  if (H('del')) H('del').onclick = () => { if (prompt('PIN para eliminar') !== AL.cfg.pin) return AL.toast('PIN incorrecto'); MEM.store(MEM.list().filter(x => x.id !== id)); AL.closeModal(); render(); AL.toast('Eliminada de este navegador (en Google Sheets se conserva)'); };
}

/* ---------- 4 · guardar y exportar ---------- */
function datos() {
  const n = MEM.reales().length, ne = MEM.list().filter(r => r.ejemplo).length, pend = (AL.state.pending || (AL.LS.get('al_outbox', []) || []).length);
  const nube = AL.hasCloud() ? `☁️ Conectado a Google Sheets${pend ? ` · <b>${pend}</b> envíos pendientes` : ' · todo enviado'}` : '⚠️ Sin nube: los datos solo están en este navegador. Descarga el respaldo o configura la clave en ⚙️ Ajustes.';
  H('p-datos').innerHTML = `<div class="banner" style="background:#fff">${nube}</div>
  <div class="ex">
    <div class="card"><h3>📊 Excel / CSV</h3><p>Todas las respuestas reales en columnas (preguntas, categorías, horas, idea, padrino). Se abre directo en Excel.</p><button class="b k" id="xcsv">Descargar CSV (${n})</button></div>
    <div class="card"><h3>💾 Respaldo completo</h3><p>Archivo con todo, incluidas las fotos. Sirve para no perder nada y para unir varios computadores.</p><button class="b k" id="xjson">Descargar respaldo</button> <label class="b" style="cursor:pointer">Importar respaldo<input type="file" id="imp" accept=".json" hidden></label></div>
    <div class="card"><h3>📄 Informe en PDF</h3><p>Resumen, informe por caso y hoja de ruta, listo para enviar a Alico y a Softgic. En la ventana de impresión elige «Guardar como PDF».</p><button class="b k" id="xpdf">Imprimir / PDF</button></div>
    <div class="card"><h3>☁️ Google Sheets</h3><p>Reenvía todas las respuestas reales a la hoja «Respuestas» (no duplica: actualiza por código).</p><button class="b" id="xsh">Enviar todo a Sheets</button> <button class="b" id="xpull">Traer de la nube</button></div>
    <div class="card"><h3>⟲ Contador del muro</h3><p>${MEM.cfg.desde ? 'Reiniciado el ' + new Date(MEM.cfg.desde).toLocaleString('es-CO') + '.' : 'Cuenta todas las respuestas.'} Reiniciarlo no borra datos: el informe conserva todo.</p><button class="b" id="xrst">Reiniciar ahora</button>${MEM.cfg.desde ? ' <button class="b" id="xall">Volver a contar todo</button>' : ''}<div class="field" style="margin-top:.8rem"><label class="small muted">Nombre del evento</label><input id="evn" value="${esc(MEM.cfg.evento)}" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:.5rem"></div></div>
    <div class="card"><h3>🧹 Limpieza</h3><p>Hay ${ne} respuestas de ejemplo y ${n} reales en este navegador.</p><button class="b" id="xej">Quitar ejemplos</button> <button class="b" id="xej2">Cargar ejemplos</button> <button class="b d" id="xdel">Borrar todo de este navegador</button></div>
  </div>`;
  const pin = () => prompt('PIN del taller') === AL.cfg.pin || (AL.toast('PIN incorrecto'), false);
  const stamp = () => new Date().toISOString().slice(0, 10);
  H('xcsv').onclick = () => { if (!n) return AL.toast('Aún no hay respuestas reales'); AL.download(`memorias-alico-${stamp()}.csv`, 'text/csv;charset=utf-8', MEM.csv(MEM.reales().map(MEM.flat))); };
  H('xjson').onclick = () => AL.download(`respaldo-memorias-alico-${stamp()}.json`, 'application/json', MEM.respaldo());
  H('imp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const k = MEM.importar(await f.text()); render(); AL.toast(k + ' respuestas importadas o actualizadas'); } catch (er) { AL.toast('Ese archivo no es un respaldo válido'); } };
  H('xpdf').onclick = () => print();
  H('xsh').onclick = async () => { if (!AL.hasCloud()) return AL.toast('Configura la nube en ⚙️ Ajustes'); MEM.reales().forEach(r => MEM.save(r)); await AL.sync(); datos(); AL.toast('Enviado a Google Sheets'); };
  H('xpull').onclick = () => H('sync').click();
  H('xrst').onclick = () => { if (!pin()) return; MEM.cfg.desde = Date.now(); MEM.saveCfg(); datos(); AL.toast('Contador del muro en cero'); };
  if (H('xall')) H('xall').onclick = () => { MEM.cfg.desde = 0; MEM.saveCfg(); datos(); };
  H('evn').onchange = e => { MEM.cfg.evento = e.target.value.trim() || MEM.cfg.evento; MEM.saveCfg(); render(); };
  H('xej').onclick = () => { MEM.store(MEM.reales().length ? MEM.reales() : []); conEj = false; render(); AL.toast('Ejemplos quitados'); };
  H('xej2').onclick = () => { MEM.store(MEM.reales().concat(MEM.seed())); render(); };
  H('xdel').onclick = () => { if (!pin() || !confirm('¿Borrar TODAS las respuestas de este navegador? Descarga antes el respaldo. Lo que ya está en Google Sheets se conserva.')) return; MEM.store([]); render(); };
}
})();
</script>
</body>
</html>
