<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empaquemos estas memorias · Alico</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/al.css">
<style>
:root{--gold:#DA9100;--gold2:#F2B33D;--goldL:#FFF4DE;--ink:#1F1B16;--mut:#6E6558;--bg:#FBF8F3;--line:#ECE3D4;--teal:#00758D;--card:#fff;--r:24px}
html{font-size:clamp(13px,1vw,22px)}
body{font-family:'Plus Jakarta Sans',Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 88% -8%,#FBE3B4 0%,transparent 60%),radial-gradient(700px 480px at -6% 108%,#F6E7CF 0%,transparent 60%)}
.app{position:relative;height:100vh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:1rem;padding:1.3rem 2rem 0}
/* encabezado */
.top{display:flex;align-items:center;gap:1.6rem}
.brands{display:flex;align-items:center;gap:.8rem;padding:.55rem .9rem;background:#fff;border:1px solid var(--line);border-radius:18px}
.brands img{height:1.9rem;display:block}.brands .x{color:#b9ad9a;font-weight:500}
.ttl small{display:block;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ttl h1{margin:.1rem 0 0;font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ttl h1 em{font-style:normal;color:var(--gold)}
.stats{display:flex;gap:.6rem;margin-left:auto}
.st{background:#fff;border:1px solid var(--line);border-radius:18px;padding:.5rem 1rem;min-width:6.6rem}
.st b{display:block;font-size:1.75rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}.st small{font-size:.72rem;color:var(--mut);font-weight:600}
.st.g b{color:var(--gold)}
.cta{display:inline-flex;align-items:center;gap:.6rem;background:var(--ink);color:#fff;border-radius:99px;padding:.95rem 1.5rem;font-weight:800;font-size:1.05rem;box-shadow:0 10px 24px rgba(31,27,22,.18);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}.cta i{width:.65rem;height:.65rem;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 0 #F2B33D99;animation:pl 2s infinite;font-style:normal}
@keyframes pl{70%{box-shadow:0 0 0 10px #F2B33D00}}
/* cuerpo */
.main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1.4rem;min-height:0}
.wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1rem;min-height:0}
.gc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;box-shadow:0 6px 18px rgba(80,60,20,.06);transition:transform .2s,box-shadow .2s;animation:in .6s cubic-bezier(.2,.9,.3,1) both}
.gc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(80,60,20,.12)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.gc .ph{position:relative;flex:1;min-height:0;background:var(--goldL)}.gc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gc .cs{position:absolute;left:.6rem;bottom:.6rem;background:rgba(255,255,255,.94);border-radius:99px;padding:.22rem .7rem;font-size:.72rem;font-weight:700;display:flex;gap:.3rem;align-items:center}
.gc .ej{position:absolute;right:.6rem;top:.6rem;background:#fff;border-radius:99px;padding:.1rem .55rem;font-size:.6rem;font-weight:800;letter-spacing:.06em;color:var(--mut)}
.gc .in{padding:.75rem .95rem .85rem}
.gc h3{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.84rem;color:var(--mut);margin:.25rem 0 .4rem;line-height:1.35}
.gc .ft{font-size:.72rem;font-weight:700;color:var(--gold)}
.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:1.3rem}
.side{display:flex;flex-direction:column;gap:1rem;min-height:0}
.pnl{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.pnl h4{margin:0 0 .6rem;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.vb{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.5rem;align-items:center;margin:.42rem 0;font-size:.86rem;font-weight:600}
.vb .tr{grid-column:2/3;height:.45rem;background:#F3ECE0;border-radius:99px;overflow:hidden;margin-top:.2rem}.vb .tr i{display:block;height:100%;border-radius:99px;transition:width .8s}
.vb .nm{grid-column:2/3}.vb b{grid-row:span 2;font-size:1rem}
.vb .ic{grid-row:span 2;font-size:1.2rem}
.big{font-size:2.4rem;font-weight:800;color:var(--gold);letter-spacing:-.03em;line-height:1}
.memoBox{margin-top:auto;display:flex;align-items:flex-end;gap:.5rem}
.memoBox .say{background:#fff;border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:.6rem .9rem;font-size:.88rem;font-weight:600;flex:1}
/* pie */
.foot{min-width:0;display:flex;align-items:center;gap:1rem;padding:.55rem 0 .7rem;font-size:.8rem;color:var(--mut);border-top:1px solid var(--line)}
.tick{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tick span{display:inline-block;animation:mq 90s linear infinite;padding-left:100%}.tick span i{font-style:normal;margin:0 1.8rem}.tick b{color:var(--ink)}
@keyframes mq{to{transform:translateX(-100%)}}
.lnk{color:var(--mut);text-decoration:none;font-weight:600;background:none;font-size:.8rem;padding:0}.lnk:hover{color:var(--gold)}
/* aviso de nueva memoria: discreto, en la esquina */
.toastC{position:fixed;right:1.6rem;bottom:4.2rem;z-index:40;background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:20px;box-shadow:0 18px 40px rgba(31,27,22,.18);padding:.8rem 1rem;display:flex;gap:.8rem;align-items:center;max-width:26rem;animation:tin .5s cubic-bezier(.2,.9,.3,1)}
.toastC img{width:4.2rem;height:4.2rem;border-radius:14px;object-fit:cover}.toastC b{display:block;font-size:1rem}.toastC small{color:var(--mut)}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
#conf{position:fixed;inset:0;z-index:45;pointer-events:none}

/* ===================== entrevista ===================== */
#flow{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;grid-template-rows:auto 1fr;padding:1.1rem 2rem 1.4rem;gap:1rem}
#flow.on{display:grid}
#flow:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 520px at 0% 0%,#FBE3B4 0%,transparent 55%)}
.fh{position:relative;display:flex;align-items:center;gap:1rem}
.prog{flex:1;display:flex;gap:.35rem}
.prog div{flex:1;font-size:.68rem;font-weight:700;color:#b5a991;text-align:center}
.prog div:before{content:"";display:block;height:.38rem;border-radius:99px;background:#EDE3D2;margin-bottom:.3rem}
.prog div.on{color:var(--ink)}.prog div.on:before{background:var(--gold)}.prog div.now{color:var(--gold)}.prog div.now:before{background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 0 3px #F2B33D33}
.xb{background:#fff;border:1px solid var(--line);border-radius:99px;padding:.5rem 1rem;font-weight:700;font-size:.85rem}
.fb{position:relative;display:grid;grid-template-columns:minmax(18rem,.8fr) minmax(0,1.45fr);gap:2rem;min-height:0}
.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;min-height:0}
.lc .memo{max-height:38vh}
.sub{width:100%;background:var(--ink);color:#fff;border-radius:22px;padding:1rem 1.3rem;position:relative}
.sub small{display:flex;gap:.5rem;align-items:center;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:800;margin-bottom:.35rem}
.sub p{margin:0;font-size:1.45rem;font-weight:700;line-height:1.35}
.sub p span{opacity:.32;transition:opacity .12s}.sub p span.on{opacity:1}
.sub:after{content:"";position:absolute;left:50%;top:-12px;transform:translateX(-50%);border:12px solid transparent;border-bottom-color:var(--ink);border-top:0}
.rep{background:none;color:var(--gold2);font-weight:700;font-size:.82rem;padding:0;margin-top:.5rem}
.rc{background:#fff;border:1px solid var(--line);border-radius:28px;padding:1.4rem 1.6rem;overflow:auto;box-shadow:0 20px 50px rgba(80,60,20,.08);min-height:0}
.rc h2{margin:0 0 .2rem;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.qn{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.hint{color:var(--mut);font-size:.95rem;margin:.2rem 0 .8rem}
.live{position:relative;min-height:7.5rem;border-radius:20px;border:2px solid var(--line);background:#FFFCF6;padding:1rem 1.2rem;font-size:1.3rem;line-height:1.5;font-weight:500}
.live.rec{border-color:var(--gold);box-shadow:0 0 0 5px #F2B33D22}
.live .ph{color:#b5a991}.live .int{color:#a08f73;font-style:italic}
.live .cur{display:inline-block;width:2px;height:1.2em;background:var(--gold);vertical-align:-.2em;margin-left:2px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.live textarea{width:100%;min-height:6rem;border:0;background:transparent;font:inherit;resize:vertical;outline:none;color:var(--ink)}
.mrow{display:flex;align-items:center;gap:1rem;margin:.8rem 0}
.mic{width:4.6rem;height:4.6rem;border-radius:50%;background:var(--ink);color:#fff;font-size:1.8rem;flex:none;box-shadow:0 8px 20px rgba(31,27,22,.25)}
.mic.on{background:#D64545;animation:rec 1.3s infinite}@keyframes rec{70%{box-shadow:0 0 0 18px rgba(214,69,69,0)}}
.wave{display:flex;gap:3px;align-items:center;height:1.6rem}.wave i{width:4px;border-radius:9px;background:var(--gold);height:20%;animation:wv 1s ease-in-out infinite}.wave.off i{animation:none;height:15%;background:#E2D7C4}
@keyframes wv{50%{height:100%}}
.mst{font-weight:700;font-size:.95rem}.mst small{display:block;color:var(--mut);font-weight:500;font-size:.8rem}
.edit{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.45rem .9rem;font-weight:700;font-size:.82rem}
.ql{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:1rem 0 .45rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:.55rem 1rem;font-weight:600;font-size:.92rem;color:var(--ink);transition:all .15s}
.chips button:hover{border-color:var(--gold)}.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.cases button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:.75rem .9rem;font-weight:700;font-size:.9rem;line-height:1.25;display:flex;gap:.6rem;align-items:center}
.cases button span{font-size:1.5rem}.cases button.on{border-color:var(--gold);background:var(--goldL);box-shadow:0 0 0 3px #F2B33D33}
.ready{display:flex;gap:.5rem}.ready button{font-size:1.9rem;background:#fff;border:1.5px solid var(--line);border-radius:16px;width:3.6rem;height:3.6rem;filter:grayscale(1);opacity:.6}.ready button.on{filter:none;opacity:1;border-color:var(--gold);background:var(--goldL)}
.ejs{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}.ejs button{background:none;border:1px dashed #d9ccb6;border-radius:99px;padding:.3rem .8rem;font-size:.8rem;color:var(--mut)}
.nav{display:flex;justify-content:space-between;gap:.8rem;margin-top:1.2rem}
.b1{background:var(--ink);color:#fff;border-radius:16px;padding:.95rem 1.6rem;font-weight:800;font-size:1.05rem}.b1:hover{background:#000}
.b2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.95rem 1.3rem;font-weight:700}
.bg{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1F1B16}
.conv{margin-top:1.2rem;border-top:1px solid var(--line);padding-top:.8rem}
.conv summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--mut)}
.conv .it{display:grid;grid-template-columns:1.6rem 1fr;gap:.5rem;font-size:.85rem;margin:.5rem 0}.conv .it b{display:block;font-size:.78rem;color:var(--gold)}
.conv .n{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--goldL);display:grid;place-items:center;font-weight:800;font-size:.75rem;color:var(--gold)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.fld label{display:block;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:.3rem}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:.75rem .9rem;font:inherit;font-size:1rem;background:#FFFCF6}
.fld{margin-bottom:.8rem}
.chk{display:flex;gap:.7rem;align-items:flex-start;font-size:.92rem;margin:.5rem 0;color:var(--mut)}.chk input{width:1.3rem;height:1.3rem;accent-color:var(--gold);margin-top:.1rem}
.idea{display:grid;grid-template-columns:15rem 1fr;gap:1.4rem;align-items:start}
.pack{background:linear-gradient(160deg,#fff 0%,#FFF4DE 100%);border:1px solid var(--line);border-radius:26px;padding:1.2rem;text-align:center;position:relative;overflow:hidden}
.pack:before{content:"";position:absolute;left:0;right:0;top:0;height:3.2rem;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.pack img.al{position:relative;height:1.3rem;margin:.15rem auto 1.5rem;display:block;filter:brightness(0) invert(1)}
.pack h3{margin:.2rem 0;font-size:1.25rem;font-weight:800}.pack p{margin:0;color:var(--mut);font-size:.85rem}
.pack .tg{display:inline-block;margin-top:.7rem;background:#fff;border:1px solid var(--line);border-radius:99px;padding:.2rem .7rem;font-size:.75rem;font-weight:700}
.vid{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:55vh;margin:0 auto}.vid video,.vid img{width:100%;height:100%;object-fit:cover;display:block}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-size:8rem;font-weight:800;color:#fff;text-shadow:0 0 30px #000;pointer-events:none}
.frame{position:absolute;inset:6%;border:3px dashed rgba(255,255,255,.7);border-radius:20px;pointer-events:none}
.spin2{width:3rem;height:3rem;border:4px solid #EEDFC2;border-top-color:var(--gold);border-radius:50%;animation:sp .9s linear infinite;margin:1rem auto}@keyframes sp{to{transform:rotate(360deg)}}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:.8rem}.sum div{background:#FFFCF6;border:1px solid var(--line);border-radius:16px;padding:.7rem .9rem;font-size:.88rem}.sum b{display:block;font-size:.72rem;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.memo{animation:fl 3.2s ease-in-out infinite}.memo.talk{animation:fl 1.1s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
@media (max-width:1100px){body{overflow:auto;height:auto}.app{height:auto}.main,.fb,.idea{grid-template-columns:1fr}.wall{grid-template-columns:repeat(2,1fr);grid-auto-rows:16rem}.stats{display:none}.cases{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brands"><img src="assets/alico.png" alt="Alico"><span class="x">×</span><img src="assets/softgic.png" alt="Softgic"></div>
    <div class="ttl"><small>GEN IA · Orgullosamente Alico</small><h1>Empaquemos estas <em>memorias</em></h1></div>
    <div class="stats" id="stats"></div>
    <button class="cta" id="go"><i></i> Hablar con Memo</button>
  </header>
  <div class="main">
    <div class="wall" id="wall"></div>
    <aside class="side">
      <div class="pnl"><h4>Lo que piden los colaboradores</h4><div id="votes"></div></div>
      <div class="pnl"><h4>Lo que más tiempo les quita</h4><div id="pains"></div></div>
      <div class="memoBox"><div class="say" id="say">Cuéntame en 5 minutos qué te gustaría que la IA hiciera por ti.</div><div id="memoTop"></div></div>
    </aside>
  </div>
  <footer class="foot"><div class="tick"><span id="tk"></span></div><a class="lnk" href="admin.html">Informe</a><button class="lnk" id="set">Ajustes</button><button class="lnk" id="rst" title="Reinicia los contadores del muro (no borra nada)">⟲ Reiniciar contador</button></footer>
</div>
<div id="flow"></div>
<canvas id="conf"></canvas>

<script src="shared/al.js"></script>
<script src="shared/mem.js"></script>
<script>
(() => {
'use strict';
const $ = AL.$, esc = AL.esc, $$ = s => [...document.querySelectorAll(s)], H = id => document.getElementById(id);

/* ============================ muro ============================ */
let page = 0; const PER = 8;
const vis = () => { const l = MEM.muro(), real = l.filter(r => !r.ejemplo); return real.length ? real : l; };
function renderTop() {
  const l = vis(), s = MEM.stats(l);
  H('stats').innerHTML = [[s.n, 'memorias', ''], [s.grupos, 'grupos', ''], [s.horas.toLocaleString('es-CO'), 'h/semana por liberar', 'g']].map(([n, t, c]) => `<div class="st ${c}"><b>${n}</b><small>${t}</small></div>`).join('');
  const mv = Math.max(1, ...s.casos.map(c => c.votos));
  H('votes').innerHTML = s.casos.slice().sort((a, b) => b.votos - a.votos).map(c => `<div class="vb"><span class="ic">${c.ic}</span><span class="nm">${esc(c.n)}</span><b>${c.votos}</b><span class="tr"><i style="width:${c.votos / mv * 100}%;background:${c.c}"></i></span></div>`).join('');
  const md = Math.max(1, ...s.dolores.map(d => d[2]));
  H('pains').innerHTML = s.dolores.slice(0, 3).map(([, n, k]) => `<div class="vb" style="grid-template-columns:1fr auto"><span class="nm" style="grid-column:1">${esc(n)}</span><b style="grid-row:auto">${k}</b><span class="tr" style="grid-column:1/-1"><i style="width:${k / md * 100}%;background:var(--gold)"></i></span></div>`).join('') || '<p class="hint">Aún sin respuestas.</p>';
  const tk = l.slice(0, 14).map(r => `<i>“${esc((r.t || [])[0] || (r.h || {}).eslogan || '')}” — <b>${esc(r.participante || '')}</b>, ${esc(r.area || '')}</i>`).join('');
  H('tk').innerHTML = tk || '<i>Sé la primera persona en dejar su memoria.</i>';
}
function renderWall() {
  const l = vis(), pages = Math.max(1, Math.ceil(l.length / PER)); if (page >= pages) page = 0;
  const sl = l.slice(page * PER, page * PER + PER);
  if (!l.length) { H('wall').innerHTML = '<div class="empty">✨ El muro está listo.<br>Toca «Hablar con Memo» para dejar la primera memoria.</div>'; return; }
  H('wall').style.gridTemplateColumns = `repeat(${sl.length <= 3 ? Math.max(sl.length, 2) : 4},minmax(0,1fr))`;
  H('wall').innerHTML = sl.map((r, i) => { const c = MEM.caso((r.a || {}).caso) || {}, h = r.h || {};
    return `<div class="gc" data-id="${r.id}" style="animation-delay:${i * .06}s"><div class="ph">${r.foto ? `<img src="${r.foto}" alt="">` : `<div style="height:100%;display:grid;place-items:center;font-size:3rem">💡</div>`}${r.ejemplo ? '<span class="ej">EJEMPLO</span>' : ''}${c.n ? `<span class="cs">${c.ic} ${esc(c.n)}</span>` : ''}</div>
    <div class="in"><h3>${esc(h.nombre_idea || r.grupo)}</h3><q>${esc((r.t || [])[0] || h.eslogan || '')}</q><div class="ft">${esc(r.grupo)} · ${esc(r.participante || '')} · ${esc(r.area || '')}</div></div></div>`; }).join('');
  sl.filter(r => !r.foto && !r.ejemplo).forEach(r => MEM.fetchFoto(r).then(f => f && renderWall()));
}
H('wall').onclick = e => { const c = e.target.closest('.gc'); if (c) detalle(c.dataset.id); };
function detalle(id) {
  const r = MEM.get(id); if (!r) return; const a = r.a || {}, h = r.h || {}, c = MEM.caso(a.caso) || {};
  AL.modal(`<div style="font-family:'Plus Jakarta Sans',sans-serif"><div style="display:grid;grid-template-columns:14rem 1fr;gap:1.2rem">${r.foto ? `<img src="${r.foto}" style="width:100%;border-radius:18px">` : '<div></div>'}<div><div class="qn">${esc(r.grupo)} · ${esc(r.area)}</div><h2 style="margin:.2rem 0">${esc(h.nombre_idea || '')}</h2><p style="color:#6E6558">${esc(r.participante)} · ${esc(r.rol || '')}</p><p>${esc(h.historia_usuario || '')}</p></div></div>
  <div class="sum">${MEM.Q.map((q, i) => `<div><b>${i + 1}. ${esc(q.corto)}</b>${esc(resumenResp(r, i))}</div>`).join('')}<div><b>Padrino o madrina</b>${esc(r.padrino || '—')}</div></div>
  <div style="text-align:right;margin-top:1rem"><button class="b2" onclick="AL.closeModal()">Cerrar</button></div></div>`);
}
function resumenResp(r, i) {
  const a = r.a || {}, t = (r.t || [])[i] || '';

function confetti(n = 120) {
  const c = H('conf'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const P = [], cols = ['#DA9100', '#F2B33D', '#1F1B16', '#00758D', '#FBE3B4'];
  for (let i = 0; i < n; i++) P.push({ x: innerWidth * (.55 + Math.random() * .45), y: -20 - Math.random() * 200, vx: (Math.random() - .6) * 4, vy: 2 + Math.random() * 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[i % cols.length] });
  let f = 0; (function a() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++f < 200) requestAnimationFrame(a); else x.clearRect(0, 0, c.width, c.height); })();
}

/* ============================ voz de Memo con subtítulos ============================ */
let talkId = 0;
function speak(t, cb, subEl) {
  const id = ++talkId, words = t.split(/\s+/);
  if (subEl) { subEl.innerHTML = words.map(w => `<span>${esc(w)} </span>`).join(''); }
  const spans = subEl ? [...subEl.children] : [], mark = n => spans.forEach((s, i) => s.classList.toggle('on', i <= n));
  $$('#flow .memo').forEach(m => m.classList.add('talk'));
  let fallback = null;
  const done = () => { if (id !== talkId) return; clearInterval(fallback); mark(words.length); $$('#flow .memo').forEach(m => m.classList.remove('talk')); cb && cb(); cb = null; };
  /* si la voz no reporta palabras, avanzamos los subtítulos al ritmo típico del habla */
  let k = -1; const startFb = () => { fallback = setInterval(() => { if (id !== talkId) return clearInterval(fallback); k++; mark(k); if (k >= words.length) clearInterval(fallback); }, 330); };
  if (!AL.cfg.voz || !('speechSynthesis' in window)) { startFb(); setTimeout(done, words.length * 330 + 300); return; }
  try {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t), v = AL.mejorVoz(); u.lang = v ? v.lang : 'es-CO'; if (v) u.voice = v; u.rate = v && /natural|neural|online/i.test(v.name) ? 1.02 : .97;
    let got = false; u.onboundary = e => { if (e.name && e.name !== 'word') return; got = true; clearInterval(fallback); const n = t.slice(0, e.charIndex).split(/\s+/).filter(Boolean).length; mark(n); };
    u.onstart = () => setTimeout(() => { if (!got) startFb(); }, 700); u.onend = done; u.onerror = done; speechSynthesis.speak(u);
    setTimeout(() => { if (!speechSynthesis.speaking && !got && id === talkId) { startFb(); setTimeout(done, words.length * 330); } }, 1500);
  } catch (e) { startFb(); setTimeout(done, words.length * 330); }
}

async function historia() {
  const c = MEM.caso(R.a.caso) || {}, base = historiaBasica();
  if (!AL.hasIA()) return base;
  const sys = `Eres Memo, analista de negocio de Softgic. Con las respuestas de un colaborador de Alico (empaques flexibles y termoformados, Medellín) redacta una oportunidad de automatización o IA. Devuelve SOLO JSON: {"nombre_idea":"máx. 5 palabras, atractivo","eslogan":"máx. 10 palabras","historia_usuario":"Como <rol> quiero <capacidad> para <beneficio>","impacto":"1 frase con horas o resultado","prioridad":"Alta|Media|Baja","primer_paso":"1 frase concreta"}. Usa solo lo que dijo; no inventes cifras.`;
  const u = `Persona: ${R.participante}, ${R.rol || 'sin cargo'}, área ${R.area}.\nTarea que le quita tiempo: ${MEM.lab(MEM.DOLORES, R.a.dolor)} — «${R.t[0]}»\nTiempo: ${R.a.horas} h/semana, ${R.a.personas} personas — «${R.t[1]}»\nCaso que quiere primero: ${c.n} — «${R.t[2]}»\nQué quiere que haga la IA: ${R.a.ayuda.map(k => MEM.lab(MEM.AYUDAS, k)).join(', ')} — «${R.t[3]}»\nQué necesita para adoptarla: ${R.a.barreras.map(k => MEM.lab(MEM.BARRERAS, k)).join(', ')}; preparación ${R.a.listo}/5 — «${R.t[4]}»`;
  try { const h = AL.parseJSON(await AL.claude(sys, u, { max: 700, tag: 'memorias-historia' })); return Object.assign(base, h, { via: 'ia' }); } catch (e) { return base; }
}
function historiaBasica() {
  const c = MEM.caso(R.a.caso) || {}, hrs = MEM.horasEquipo(R), cut = (s, n) => { s = (s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n).replace(/\s\S*$/, '') + '…' : s; };
  const ay = MEM.lab(MEM.AYUDAS, R.a.ayuda[0] || '').replace(/^Que /, 'una IA que ');
  return { nombre_idea: (c.n || 'Mi idea').replace(/ ·.*/, '') + ' en ' + R.area, eslogan: cut(R.t[2] || ay, 60), historia_usuario: `Como ${(R.rol || 'colaborador').toLowerCase()} de ${R.area} quiero ${ay || 'apoyo de IA'} para ${cut(R.t[0], 80) ? 'dejar de perder tiempo en «' + cut(R.t[0], 80) + '»' : 'trabajar mejor'}.`,
    impacto: hrs ? `${hrs} horas a la semana del equipo` : 'Menos tiempo en tareas repetitivas', prioridad: hrs > 40 ? 'Alta' : hrs > 10 ? 'Media' : 'Baja', primer_paso: c.piloto || 'Piloto corto en un área', caso: R.a.caso, via: 'reglas' };
}

  <div><div class="fld"><label>Nombre de la idea</label><input id="rn" value="${esc(h.nombre_idea)}"></div><div class="fld"><label>Historia de usuario</label><textarea id="rh" rows="3">${esc(h.historia_usuario)}</textarea></div>
  <div class="f2"><div class="fld"><label>Padrino o madrina (quien la impulsa)</label><input id="pd" placeholder="Ej.: jefe del área" value="${esc(R.padrino)}"></div><div class="fld"><label>Primer paso</label><input id="pp" value="${esc(h.primer_paso || '')}"></div></div>
  <div class="sum" style="grid-template-columns:repeat(3,1fr)"><div><b>Impacto</b>${esc(h.impacto || '')}</div><div><b>Prioridad</b>${esc(h.prioridad || '')}</div><div><b>Preparación</b>${MEM.LISTO[(R.a.listo || 3) - 1]} ${R.a.listo}/5</div></div></div></div>
  <div class="nav"><button class="b2" id="bk">← Corregir respuestas</button><button class="b1 bg" id="nx">${R.fotoOk ? 'Me gusta · foto 📸' : 'Me gusta · publicar ✨'}</button></div>`);
  H('rn').oninput = e => H('pk1').textContent = e.target.value;
  const sync = () => { h.nombre_idea = H('rn').value.trim() || h.nombre_idea; h.historia_usuario = H('rh').value; h.primer_paso = H('pp').value; R.padrino = H('pd').value.trim(); };
  H('bk').onclick = () => { sync(); step = 1; draw(); };
  H('nx').onclick = () => { sync(); if (R.fotoOk) next(); else publicar(); };
}

/* --- 8 · foto del grupo --- */
let stream = null;
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function dFoto() {
  shell('¡La foto del grupo! Júntense, sonrían, y cuando estén listos toquen el botón.', `<div class="qn">Foto</div><h2>Foto del grupo</h2><div class="vid" id="vid" style="margin-top:.8rem"><video id="v" autoplay playsinline muted></video><div class="frame"></div><div class="cd" id="cd"></div></div>
  <div class="nav"><button class="b2" id="skip">Seguir sin foto</button><div style="display:flex;gap:.6rem"><label class="b2" style="cursor:pointer">📁 Subir foto<input type="file" accept="image/*" id="up" hidden></label><button class="b1 bg" id="snap">📸 Tomar foto (3, 2, 1)</button></div></div>`);
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } }); H('v').srcObject = stream; }
  catch (e) { H('vid').innerHTML = '<div style="display:grid;place-items:center;height:100%;color:#fff;text-align:center;padding:1rem">No pude abrir la cámara.<br>Permite la cámara en el candado 🔒 o sube una foto.</div>'; }
  H('skip').onclick = () => { R.foto = null; publicar(); };
  H('up').onchange = async e => { const f = e.target.files[0]; if (f) { R.foto = await shrink(f); confirmFoto(); } };
  H('snap').onclick = async () => {
    if (!stream) return AL.toast('Sube una foto o sigue sin ella'); H('snap').disabled = true;
    for (let n = 3; n > 0; n--) { H('cd').textContent = n; await new Promise(r => setTimeout(r, 900)); } H('cd').textContent = '';
    const v = H('v'), c = document.createElement('canvas'), w = 560, hh = Math.round(w * v.videoHeight / v.videoWidth) || 420; c.width = w; c.height = hh; c.getContext('2d').drawImage(v, 0, 0, w, hh);
    R.foto = c.toDataURL('image/jpeg', .72); confirmFoto();
  };
}
function shrink(f) { return new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, 560 / im.width), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); }; im.src = URL.createObjectURL(f); }); }
function confirmFoto() { stopCam(); H('vid').innerHTML = `<img src="${R.foto}">`; $('.nav').innerHTML = `<button class="b2" id="re">🔁 Repetir</button><button class="b1 bg" id="ok">¡Quedó genial! Publicar ✨</button>`; H('re').onclick = () => dFoto(); H('ok').onclick = publicar; }

/* --- 9 · publicado --- */
function publicar() {
  const rec = { id: R.id, ts: new Date().toISOString(), sesion: AL.cfg.sesion, grupo: R.grupoLabel, grupo_n: R.grupo, participante: R.participante, rol: R.rol, area: R.area, consent: R.consent, foto_ok: R.fotoOk, t: R.t.slice(), a: JSON.parse(JSON.stringify(R.a)), h: R.h, foto: R.foto, padrino: R.padrino || 'Por definir' };
  MEM.save(rec); AL.log('memoria_publicada', { caso_id: 'memorias', area: rec.area, via: R.h.via, ok: 'si', detalle: (R.h.nombre_idea || '').slice(0, 100) });
  step = 9; const c = MEM.caso(rec.a.caso) || {};
  shell(`¡Gracias, ${R.participante}! Tu memoria ya está en el muro y tu voz quedó en el informe para Alico y Softgic.`, `<div style="text-align:center"><div class="qn">Listo</div><h2 style="font-size:2rem">¡Tu memoria está en el muro! 🎉</h2><p class="hint">Gracias por contarnos qué te gustaría que la IA hiciera por ti.</p>
    ${rec.foto ? `<img src="${rec.foto}" style="max-width:24rem;width:100%;border-radius:22px;margin:.6rem auto;display:block">` : ''}
    <div class="sum" style="text-align:left"><div><b>Tu idea</b>${esc(rec.h.nombre_idea)}</div><div><b>El caso que quieres primero</b>${c.ic || ''} ${esc(c.n || '')}</div><div><b>Tiempo que se puede liberar</b>${MEM.horasEquipo(rec)} h/semana del equipo</div><div><b>Padrino o madrina</b>${esc(rec.padrino)}</div></div>
    <div class="nav" style="justify-content:center"><button class="b1 bg" id="fin">Ver el muro ➜</button></div></div>`);
  confetti(160);
  const t = setTimeout(() => H('fin') && H('fin').click(), 20000);
  H('fin').onclick = () => { clearTimeout(t); closeFlow(); page = 0; refresh(); aviso(MEM.get(rec.id)); };
}

refresh();
window.__mem = { MEM, open: openFlow, get R() { return R; } };
})();
</script>
</body>
